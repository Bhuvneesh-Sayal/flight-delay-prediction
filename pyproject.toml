[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "flight-delay-prediction"
version         = "0.1.0"
description     = "Scalable flight delay prediction using PySpark — DA231o project"
requires-python = ">=3.10"
license         = {text = "MIT"}

dependencies = [
    "pyspark==4.0.0",
    "pyarrow>=15.0,<16.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.26,<2.0",
    "scipy>=1.12",
    "airportsdata>=20240101",
    "requests>=2.31",
    "matplotlib>=3.8",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
