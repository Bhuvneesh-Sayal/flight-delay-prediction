# =============================================================================
# docker-compose.yml
# =============================================================================
# 3-node Spark standalone cluster (1 master + 3 workers) + a driver service
# for submitting jobs.
#
# Usage
# -----
#   docker compose build                   # build the shared image once
#   docker compose up -d                   # start master + workers
#   docker compose run --rm driver \       # run a pipeline step
#       python main.py --steps benchmarks
#   docker compose down                    # stop everything
#
# Web UIs (available after `docker compose up`)
#   http://localhost:8080  — Spark Master UI  (cluster overview)
#   http://localhost:8081  — Worker 1 UI
#   http://localhost:8082  — Worker 2 UI
#   http://localhost:8083  — Worker 3 UI
#   http://localhost:4040  — Spark App UI     (only while a job is running)
# =============================================================================

services:

  # ── Master ──────────────────────────────────────────────────────────────────
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: spark-local:3.5.1
    hostname: spark-master
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master        # bind to container hostname
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    ports:
      - "8080:8080"    # Master Web UI
      - "7077:7077"    # Cluster manager port
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ./data:/app/data           # raw + processed data
      - ./models:/app/models       # saved model artefacts
      - ./results:/app/results     # plots + CSVs
      - ./logs:/app/logs           # pipeline logs
    networks:
      - spark-net

  # ── Workers ─────────────────────────────────────────────────────────────────
  spark-worker-1:
    image: spark-local:3.5.1
    hostname: spark-worker-1
    container_name: spark-worker-1
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "4g"
      SPARK_WORKER_WEBUI_PORT: "8081"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"    # Worker 1 Web UI
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./logs:/app/logs
    networks:
      - spark-net

  spark-worker-2:
    image: spark-local:3.5.1
    hostname: spark-worker-2
    container_name: spark-worker-2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "4g"
      SPARK_WORKER_WEBUI_PORT: "8082"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8082:8082"    # Worker 2 Web UI
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./logs:/app/logs
    networks:
      - spark-net

  spark-worker-3:
    image: spark-local:3.5.1
    hostname: spark-worker-3
    container_name: spark-worker-3
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "4g"
      SPARK_WORKER_WEBUI_PORT: "8083"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8083:8083"    # Worker 3 Web UI
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./logs:/app/logs
    networks:
      - spark-net

  # ── Driver (job submission) ─────────────────────────────────────────────────
  # This service is NOT started by `docker compose up`.
  # Use it via `docker compose run --rm driver <command>`.
  #
  # Examples:
  #   docker compose run --rm driver python main.py --steps cluster_bench
  #   docker compose run --rm driver python main.py --steps ablation
  driver:
    image: spark-local:3.5.1
    hostname: spark-driver
    container_name: spark-driver
    # No default command — always pass one on the CLI
    environment:
      SPARK_MASTER_URL: "spark://spark-master:7077"
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
      spark-worker-3:
        condition: service_started
    ports:
      - "4040:4040"    # Spark App UI (only active while a job is running)
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./logs:/app/logs
      - ./benchmarks_output:/app/benchmarks_output
    networks:
      - spark-net
    profiles:
      - driver          # only started when explicitly requested

networks:
  spark-net:
    driver: bridge
