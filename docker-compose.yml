# =============================================================================
# docker-compose.yml
# =============================================================================
# 3-node Spark standalone cluster (1 master + 3 workers) + a driver service
# for submitting jobs.
#
# Security hardening applied:
#   - All published ports bound to 127.0.0.1 (loopback only)
#     Prevents unauthenticated access to the cluster from other hosts.
#   - Master and worker data/model volumes mounted read-only (:ro)
#     Workers never write to these paths; ro prevents model poisoning.
#   - Driver mounts results/logs/benchmarks read-write (it writes output).
#
# Usage
# -----
#   docker compose build                   # build the shared image once
#   docker compose up -d                   # start master + workers
#   docker compose run --rm driver \       # run a pipeline step
#       python main.py --steps benchmarks
#   docker compose down                    # stop everything
#
# Web UIs (available after `docker compose up`)
#   http://localhost:8080  — Spark Master UI  (cluster overview)
#   http://localhost:8081  — Worker 1 UI
#   http://localhost:8082  — Worker 2 UI
#   http://localhost:8083  — Worker 3 UI
#   http://localhost:4040  — Spark App UI     (only while a job is running)
# =============================================================================

services:

  # ── Master ──────────────────────────────────────────────────────────────────
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: spark-local:4.0.0
    hostname: spark-master
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"    # Master Web UI  — loopback only
      - "127.0.0.1:7077:7077"    # Cluster manager — loopback only
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',8080)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - ./data:/app/data:ro          # master reads data, never writes
      - ./models:/app/models:ro      # master reads models, never writes
      - ./results:/app/results:ro
      - ./logs:/app/logs             # keep rw so healthcheck logs land here
    networks:
      - spark-net

  # ── Workers ─────────────────────────────────────────────────────────────────
  spark-worker-1:
    image: spark-local:4.0.0
    hostname: spark-worker-1
    container_name: spark-worker-1
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "4g"
      SPARK_WORKER_WEBUI_PORT: "8081"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"    # Worker 1 Web UI — loopback only
    volumes:
      - ./data:/app/data:ro          # workers read inputs, never write
      - ./models:/app/models:ro
      - ./results:/app/results:ro
      - ./logs:/app/logs:ro
    networks:
      - spark-net

  spark-worker-2:
    image: spark-local:4.0.0
    hostname: spark-worker-2
    container_name: spark-worker-2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "4g"
      SPARK_WORKER_WEBUI_PORT: "8082"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"    # Worker 2 Web UI — loopback only
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./results:/app/results:ro
      - ./logs:/app/logs:ro
    networks:
      - spark-net

  spark-worker-3:
    image: spark-local:4.0.0
    hostname: spark-worker-3
    container_name: spark-worker-3
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "4g"
      SPARK_WORKER_WEBUI_PORT: "8083"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"    # Worker 3 Web UI — loopback only
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./results:/app/results:ro
      - ./logs:/app/logs:ro
    networks:
      - spark-net

  # ── Driver (job submission) ─────────────────────────────────────────────────
  # This service is NOT started by `docker compose up`.
  # Use it via `docker compose run --rm driver <command>`.
  #
  # The driver writes results, models, logs, and benchmarks, so those
  # volumes remain read-write here.
  driver:
    image: spark-local:4.0.0
    hostname: spark-driver
    container_name: spark-driver
    environment:
      SPARK_MASTER_URL: "spark://spark-master:7077"
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      # Inside Docker the driver talks to Kafka via the internal listener
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
      spark-worker-3:
        condition: service_started
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:4040:4040"    # Spark App UI — loopback only
    volumes:
      - ./data:/app/data:ro          # driver reads features/processed data
      - ./models:/app/models         # driver writes trained models
      - ./results:/app/results       # driver writes result CSVs + plots
      - ./logs:/app/logs             # driver writes pipeline.log
      - ./benchmarks_output:/app/benchmarks_output
      - ./src:/app/src:ro            # mount src/ so code fixes apply without rebuild
      - ./config:/app/config:ro      # mount config/ too
    networks:
      - spark-net
    profiles:
      - driver

  # ── Kafka (KRaft mode — no Zookeeper) ──────────────────────────────────────
  # Single-broker Kafka for local development.  KRaft mode uses Kafka's own
  # built-in Raft consensus — no separate Zookeeper process needed.
  #
  # The broker is reachable:
  #   - From the host machine:         localhost:9092
  #   - From other Docker containers:  kafka:9092
  #
  # Topics are auto-created on first produce/consume.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"    # PLAINTEXT — host access (also advertised to Spark)
      - "127.0.0.1:9094:9094"    # PLAINTEXT_HOST — legacy external port
    environment:
      # KRaft: broker acts as both broker and controller (single node)
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # Two listeners:
      #   PLAINTEXT     — used by containers inside spark-net (kafka:9092)
      #   PLAINTEXT_HOST — advertised to the Docker host (localhost:9092)
      KAFKA_LISTENERS: "PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # Topic defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_NUM_PARTITIONS: "3"

      # KRaft cluster ID — must be a valid base64-encoded UUID
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - spark-net

networks:
  spark-net:
    driver: bridge

volumes:
  kafka-data:   # named volume for Kafka log persistence across restarts
