# =============================================================================
# spark_docker/docker-compose.yml
# =============================================================================
# 3-node Spark standalone cluster (1 master + 3 workers) + a driver service.
#
# Usage (run from this folder):
#   docker compose build
#   docker compose up -d
#   docker compose --profile driver run --rm driver \
#       /opt/spark/bin/spark-submit --master spark://spark-master:7077 /app/main.py
#   docker compose down
#
# Web UIs:
#   http://localhost:8080  — Spark Master
#   http://localhost:8081  — Worker 1
#   http://localhost:8082  — Worker 2
#   http://localhost:8083  — Worker 3
#   http://localhost:4040  — Spark App UI (while a job is running)
# =============================================================================

services:

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: spark-local:3.5.1
    hostname: spark-master
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    ports:
      - "8080:8080"
      - "7077:7077"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ./volumes/data:/app/data
      - ./volumes/models:/app/models
      - ./volumes/results:/app/results
      - ./volumes/logs:/app/logs
      - ./volumes/benchmarks_output:/app/benchmarks_output
    networks:
      - spark-net

  spark-worker-1:
    image: spark-local:3.5.1
    hostname: spark-worker-1
    container_name: spark-worker-1
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "4g"
      SPARK_WORKER_WEBUI_PORT: "8081"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - ./volumes/data:/app/data
      - ./volumes/models:/app/models
      - ./volumes/results:/app/results
      - ./volumes/logs:/app/logs
    networks:
      - spark-net

  spark-worker-2:
    image: spark-local:3.5.1
    hostname: spark-worker-2
    container_name: spark-worker-2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "4g"
      SPARK_WORKER_WEBUI_PORT: "8082"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8082:8082"
    volumes:
      - ./volumes/data:/app/data
      - ./volumes/models:/app/models
      - ./volumes/results:/app/results
      - ./volumes/logs:/app/logs
    networks:
      - spark-net

  spark-worker-3:
    image: spark-local:3.5.1
    hostname: spark-worker-3
    container_name: spark-worker-3
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "4g"
      SPARK_WORKER_WEBUI_PORT: "8083"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8083:8083"
    volumes:
      - ./volumes/data:/app/data
      - ./volumes/models:/app/models
      - ./volumes/results:/app/results
      - ./volumes/logs:/app/logs
    networks:
      - spark-net

  driver:
    image: spark-local:3.5.1
    hostname: spark-driver
    container_name: spark-driver
    environment:
      SPARK_MASTER_URL: "spark://spark-master:7077"
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
      spark-worker-3:
        condition: service_started
    ports:
      - "4040:4040"
    volumes:
      - ./volumes/data:/app/data
      - ./volumes/models:/app/models
      - ./volumes/results:/app/results
      - ./volumes/logs:/app/logs
      - ./volumes/benchmarks_output:/app/benchmarks_output
    networks:
      - spark-net
    profiles:
      - driver

networks:
  spark-net:
    driver: bridge
